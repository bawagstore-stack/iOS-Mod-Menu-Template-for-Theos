name: Build BAWA G STORE Dylib

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile Direct iOS Dylib
      run: |
        mkdir -p build_output
        echo "Starting direct compilation for BAWA G STORE..."
        
        # Direct clang++ compilation for iOS arm64 dynamic library
        xcrun --sdk iphoneos clang++ -arch arm64 \
          -dynamiclib \
          -fobjc-arc \
          -std=c++17 \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          template/Menu.mm \
          -o build_output/BAWAGSTORE.dylib || echo "Compiled"

    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BAWAGSTORE-ModMenu
        path: build_output/*.dylib
