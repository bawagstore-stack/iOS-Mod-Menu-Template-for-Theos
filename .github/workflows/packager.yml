name: Build BAWA G STORE Dylib

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile iOS Mod Menu
      run: |
        mkdir -p build_output
        echo "Starting compilation for BAWA G STORE..."
        
        # Build using make or direct clang++ depending on the directory structure
        make package || xcodebuild -sdk iphoneos -configuration Release || echo "Build attempted"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BAWAGSTORE-ModMenu
        path: |
          *.dylib
          packages/*.deb
          build_output/*.dylib
