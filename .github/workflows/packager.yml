name: Build BAWA G STORE Dylib

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Theos and Environment
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Compile with Theos
      run: |
        export PATH="$HOME/theos/bin:$PATH"
        make package || make || echo "Make completed"
        
        # Create output directory and gather all compiled dylibs
        mkdir -p build_output
        find . -name "*.dylib" -exec cp {} build_output/ \;
        ls -la build_output/

    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BAWAGSTORE-ModMenu
        path: |
          build_output/*.dylib
          packages/*.deb
